<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Lumina Optics Admin</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .admin-main {
            padding: 8rem 5% 4rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .form-container {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            padding: 2.5rem;
            border-radius: 24px;
            backdrop-filter: blur(10px);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        input,
        select {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #fff;
        }

        .btn-submit {
            width: 100%;
            background: #fff;
            color: #000;
            margin-top: 1rem;
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-msg {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 12px;
            display: none;
            text-align: center;
        }

        .success {
            background: rgba(37, 211, 102, 0.2);
            color: #25D366;
            display: block;
        }

        .error {
            background: rgba(255, 68, 68, 0.2);
            color: #ff4444;
            display: block;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <div class="logo">LUMINA <span>ADMIN</span></div>
            <a href="index.html" style="color: #fff; text-decoration: none; font-size: 0.9rem; opacity: 0.7;">← Volver
                al Catálogo</a>
        </nav>
    </header>

    <main class="admin-main">
        <div class="form-container">
            <h2 style="margin-bottom: 2rem;">Añadir Nueva Montura</h2>
            <form id="product-form">
                <div class="form-group">
                    <label>Nombre de la Montura</label>
                    <input type="text" id="name" placeholder="Ej: Ray-Ban Aviator Platinum" required>
                </div>
                <div class="form-group">
                    <label>Precio (S/)</label>
                    <input type="number" id="price" step="0.01" placeholder="0.00" required>
                </div>
                <div class="form-group">
                    <label>URL de la Imagen</label>
                    <input type="url" id="image_url" placeholder="https://..." required>
                </div>
                <div class="form-group">
                    <label>Etiqueta (Badge)</label>
                    <select id="badge">
                        <option value="">Ninguna</option>
                        <option value="Nuevo">Nuevo</option>
                        <option value="Oferta">Oferta</option>
                        <option value="Best Seller">Best Seller</option>
                    </select>
                </div>
                <button type="submit" id="submit-btn" class="btn-submit">Publicar en Catálogo</button>
            </form>
            <div id="status" class="status-msg"></div>
        </div>
    </main>

    <script>
        const SB_URL = "https://dwjeejsutmkfsdmldoxq.supabase.co";
        const SB_KEY = "sb_publishable_iRRcY7--9c49Tj45fK8RAg_v0sAoMNo";
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        const form = document.getElementById('product-form');
        const status = document.getElementById('status');
        const submitBtn = document.getElementById('submit-btn');

        form.onsubmit = async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerText = 'Publicando...';
            status.className = 'status-msg';

            const product = {
                name: document.getElementById('name').value,
                price: parseFloat(document.getElementById('price').value),
                image_url: document.getElementById('image_url').value,
                badge: document.getElementById('badge').value || null
            };

            try {
                const { error } = await supabaseClient
                    .from('products')
                    .insert([product]);

                if (error) throw error;

                status.innerText = "¡Producto publicado con éxito!";
                status.classList.add('success');
                form.reset();
            } catch (err) {
                console.error(err);
                status.innerText = "Error al publicar: " + err.message;
                status.classList.add('error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Publicar en Catálogo';
            }
        };
    </script>
</body>

</html>
